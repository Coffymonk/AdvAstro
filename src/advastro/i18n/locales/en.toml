close = "Close"
manual = "What these checks mean (manual)"
master = "master frame"
settings = "Settings"
measured = "Measured"
offset = "Offset"
temp = "Temperature"
binning = "Binning"
size = "Size"
banding = "Banding"
channels = "Colour channels (R / G / B)"
not_flagged = "This frame is like the rest of its set."
frame_legend = "The frame with an automatic stretch, so faint patterns (glow, banding, dust) are visible. Wheel to zoom, drag to pan."
hot_legend = "Every hot pixel as a dot: yellow ones are just above the limit, red and larger ones are much brighter. The numbers count the hot pixels in each ninth of the sensor."
hot_title = "Hot pixels"
hot_loading = "Reading the frame to map the hot pixels…"
hot_numbers = "<b>{count}</b> hot pixels ({share} % of the sensor), each more than 10 times the noise ({noise} ADU) above its surroundings. <b>{strong}</b> of them are very strong (more than 50 times the noise). Another <b>{warm}</b> warm pixels sit between 5 and 10 times the noise."
hot_what = "A hot pixel collects heat signal (dark current) much faster than its neighbours, so it shows as a bright dot in every light frame, in the same place. Every sensor has some; the number grows with exposure time and roughly doubles for every 6–7 °C warmer the sensor is. Darks record them so they can be subtracted, and dithering plus pixel rejection in stacking removes the rest."
hot_even = "They are spread evenly over the sensor (the busiest ninth, {where}, has {ratio}× the average): normal sensor defects."
hot_cluster = "They cluster towards the {where} ({ratio}× the average there). That usually means a warm part of the sensor: amp glow or the readout electronics. Matching darks remove it, but avoid dark scaling."
hot_vs_high = "This frame has {ratio}× as many as the set's median ({median}). A frame with clearly more hot pixels was taken warmer or longer than the rest; check its temperature and exposure."
hot_vs_low = "This frame has only {ratio}× the set's median ({median}). Fewer hot pixels than the rest usually means a shorter exposure or a colder sensor than the others."
hot_vs_same = "About the same as the rest of the set (median {median}), as it should be."
hot_temp = "Taken at {temp} °C. Darks only match lights taken at the same temperature (within about 2 °C), exposure, gain and offset."
hot_todo_title = "What to do"
hot_todo = "Use darks that match the lights. Dither every 1–3 subs while imaging, so hot pixels land on different parts of the sky and are rejected when stacking. Turn on cosmetic correction (WBPP's CosmeticCorrection, or Siril's cosmetic correction from the master dark) for those that remain. A count that grows a lot from one season to the next is worth noting: sensors age."
