[gui.calinfo.why]
level = "The average level. In darks and bias it must be the same in every frame; a higher level means light got in or the offset differs."
noise = "Read noise plus heat noise. A frame noisier than the rest was warmer, longer or disturbed."
hot = "Pixels more than 10× the noise above their surroundings. See the section below."
banding = "Strength of row or column stripes. More frames in the master average them out."
level_pct = "Brightness as a share of full scale. Aim for 30–60 %; under 15 % is too dim, over 75 % may not be linear."
clipped = "Share of pixels at the top of the scale. Any clipping means the flat cannot correct those pixels."
vignetting = "How much less light the corners get than the centre. Not a fault; it is what flats correct."
dust = "Round dust shadows found. Flats correct them if nothing moved between lights and flats."
channels = "Each colour's brightness as a share of full scale. Keep the dimmest above about 10 %."
glow = "How much brighter the brightest edge or corner is than the centre: amp glow from the sensor's electronics. None found here."
glow_where = "How much brighter the brightest edge or corner (here the {where}) is than the centre: amp glow from the sensor's electronics."

