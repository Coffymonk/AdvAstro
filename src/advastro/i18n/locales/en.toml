[gui.settings.explain]
strictness = "A preset for the four limits below. Lenient keeps more subs, Strict keeps only the best."
fwhm = "Rejects subs whose stars are much larger than the session's typical size (blur, focus drift, poor seeing). Lower = stricter."
ecc = "Rejects subs whose stars are stretched (wind, guiding errors). 0 is perfectly round; 0.6 is clearly oval (about 25 % longer than wide). Lower = stricter."
stars = "Rejects subs with too few stars compared with the session's typical count (clouds, haze, dew). Higher = stricter."
sky = "Rejects subs with a much brighter sky than the rest (Moon, clouds lit by town light, dawn). Lower = stricter."

