hot_legend = "Varje het pixel som en prick: gula ligger strax över gränsen, röda och större är mycket ljusare. Talen räknar de heta pixlarna i varje niondel av sensorn."
hot_title = "Heta pixlar"
hot_loading = "Läser bilden för att kartlägga de heta pixlarna…"
hot_numbers = "<b>{count}</b> heta pixlar ({share} % av sensorn), var och en mer än 10 gånger bruset ({noise} ADU) över sin omgivning. <b>{strong}</b> av dem är mycket starka (mer än 50 gånger bruset). Ytterligare <b>{warm}</b> varma pixlar ligger mellan 5 och 10 gånger bruset."
hot_what = "En het pixel samlar värmesignal (mörkerström) mycket snabbare än sina grannar, så den syns som en ljus prick i varje ljusbild, på samma ställe. Alla sensorer har några; antalet växer med exponeringstiden och ungefär fördubblas för varje 6–7 °C varmare sensor. Darks fångar dem så att de kan dras ifrån, och dithering plus avvisning vid staplingen tar bort resten."
hot_even = "De är jämnt fördelade över sensorn (den tätaste niondelen, {where}, har {ratio}× genomsnittet): vanliga sensordefekter."
hot_cluster = "De samlas mot {where} ({ratio}× genomsnittet där). Det betyder oftast en varm del av sensorn: amp glow eller utläsningselektroniken. Matchande darks tar bort det, men undvik dark-skalning."
hot_vs_high = "Bilden har {ratio}× så många som uppsättningens median ({median}). En bild med tydligt fler heta pixlar togs varmare eller längre än resten; kontrollera temperatur och exponering."
hot_vs_low = "Bilden har bara {ratio}× uppsättningens median ({median}). Färre heta pixlar än resten betyder oftast kortare exponering eller kallare sensor än de andra."
hot_vs_same = "Ungefär som resten av uppsättningen (median {median}), som det ska vara."
hot_temp = "Tagen vid {temp} °C. Darks stämmer bara med ljusbilder tagna vid samma temperatur (inom ungefär 2 °C), exponering, gain och offset."
hot_todo_title = "Vad du gör"
hot_todo = "Använd darks som matchar ljusbilderna. Dithra var 1–3:e delbild när du fotograferar, så att heta pixlar hamnar på olika delar av himlen och avvisas vid staplingen. Slå på kosmetisk korrigering (CosmeticCorrection i WBPP, eller Sirils kosmetiska korrigering från masterdarken) för de som blir kvar. Ett antal som växer kraftigt från en säsong till nästa är värt att notera: sensorer åldras."
