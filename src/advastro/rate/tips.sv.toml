# Svensk text för tips.toml. Varje tabell ersätter motsvarande engelska fält; fält som inte
# finns här tas från den engelska filen. {platshållare} är desamma som i originalet.

[linear]
why = "Datan är fortfarande linjär: den svaga signalen finns där men har inte tagits fram. Alla andra bedömningar görs på en automatisk sträckning."
pixinsight = [
  "Bakgrund och färg först, medan datan är linjär: GraXpert eller DynamicBackgroundExtraction, sedan SpectrophotometricColorCalibration.",
  "Sträck med GeneralizedHyperbolicStretch (flera milda omgångar, symmetripunkten vid bakgrundens topp) eller HistogramTransformation via en ScreenTransferFunction-förhandsvisning.",
  "Sikta på en bakgrund runt {target_sky} % ljusstyrka.",
]
siril = [
  "Ta bort gradienten (Background Extraction eller GraXpert), sedan Photometric/Spectrophotometric Color Calibration.",
  "Sträck med Generalized Hyperbolic Stretch, eller Asinh Transformation följt av Histogram Transformation.",
  "Sikta på en bakgrund runt {target_sky} % ljusstyrka.",
]

[crushed_black]
why = "Svartpunkten är för högt satt: den mörkaste himlen har klippts till helt svart, och det tar med sig svaga stjärnor, den svaga yttre nebulositeten och all naturlig struktur ({black_clip} % av pixlarna är klippta)."
pixinsight = [
  "Gå tillbaka till versionen före det sista kurv- eller nivåsteget.",
  "HistogramTransformation: flytta skuggreglaget åt vänster tills avläsningen visar inga (eller bara några få) klippta pixlar.",
  "CurvesTransformation: lyft kurvans lägsta punkt lite så att bakgrunden hamnar nära {target_sky} %.",
]
siril = [
  "Ångra det sista nivå- eller kurvsteget.",
  "Histogram Transformation: sänk skuggvärdet tills klippningsprocenten är nära noll.",
  "Curves: lyft den nedre änden lite så att bakgrunden hamnar nära {target_sky} %.",
]

[dark_background]
why = "Bakgrunden ligger på {sky_pct} %. Det ser dramatiskt ut på en ljus skärm, men svaga stjärnor och den yttre, svaga nebulositeten sjunker ner i svart, och på mörkare skärmar ser bilden tom ut."
pixinsight = [
  "CurvesTransformation: lyft skuggorna lite (en punkt vid indata 0,05 höjd till ungefär 0,08).",
  "Eller en sista HistogramTransformation med en liten flyttning av mellantonerna åt vänster.",
  "Mål: bakgrund runt {target_sky} %, mätt med avläsningen på en tom himmelsfläck.",
]
siril = [
  "Curves: lyft kurvans nedre del lite.",
  "Eller Histogram Transformation med en liten ändring av mellantonerna.",
  "Mål: bakgrund runt {target_sky} %.",
]

[bright_background]
why = "Bakgrunden ligger på {sky_pct} %. En grå himmel sänker kontrasten och får bilden att se disig eller urblekt ut."
pixinsight = [
  "HistogramTransformation: flytta skuggreglaget åt höger tills bakgrunden sjunker till ungefär {target_sky} %, och håll koll på antalet klippta pixlar.",
  "Eller CurvesTransformation med en lätt S-kurva som gör skuggorna mörkare och behåller mellantonerna.",
]
siril = [
  "Histogram Transformation: höj skuggvärdet tills bakgrunden sjunker till ungefär {target_sky} %.",
  "Eller Curves med en mild S-kurva.",
]

[shadow_clip]
why = "{black_clip} % av pixlarna har minst en färg klippt till noll. Klippta skuggor gör himlen fläckig och tar bort svag färg."
pixinsight = [
  "Sänk svartpunkten i den sista sträckningen lite tills klippningen är under 0,1 %.",
  "Om en kanal klipps först, neutralisera bakgrunden före sträckningen (BackgroundNeutralization eller SPCC:s bakgrundssteg).",
]
siril = [
  "Sänk skuggvärdet i den sista sträckningen tills klippningen är under 0,1 %.",
  "Neutralisera bakgrunden före sträckningen (Color Calibration › Background).",
]

[gradient]
why = "Bakgrundens ljusstyrka ändras med {gradient_pct} % över bilden{direction}. Oftast är det ljusföroreningar, månljus eller en ofullständig flat. Om ljusskillnaden är verklig nebulositet kan du bortse från detta."
"why#emission" = "Bakgrundens ljusstyrka ändras med {gradient_pct} % över bilden{direction}. I en bild full av nebulosa kan en del av det vara svag nebulositet som du vill behålla: placera bakgrundspunkter bara där du är säker på att det inte finns nebulosa, eller använd färre punkter och en mildare modell."
"why#milkyway" = "Ljusstyrkan ändras med {gradient_pct} % över fältet{direction}. Vintergatan själv är en stor ljusskillnad; det som ska bort är ljusföroreningar och luftsken ovanpå den."
"pixinsight#emission" = [
  "På den linjära mastern: GraXpert med lågt Smoothing-värde, eller DynamicBackgroundExtraction med 10–20 punkter placerade bara i mörka luckor mellan nebulositeten (kontrollera varje punktruta: ingen nebulosa inuti).",
  "Correction: Subtraction. Titta på bakgrundsmodellen den skapar: den ska vara en jämn lutning utan nebulosaformer. Ser du nebulosa i modellen, ta bort de punkterna.",
  "Kontrollera resultatet med en kraftig STF: de mörka luckorna ska vara jämna, nebulosan orörd.",
]
"siril#emission" = [
  "På den linjära bilden: GraXperts (AI) bakgrundsextrahering, eller RBF-metoden med få punkter placerade bara i mörka luckor mellan nebulositeten.",
  "Correction: Subtraction. Kontrollera att bakgrundsmodellen inte visar några nebulosaformer.",
]
pixinsight = [
  "Arbeta på den linjära mastern: GraXpert (AI-bakgrundsextrahering) eller DynamicBackgroundExtraction med 15–25 punkter placerade bara på tom himmel.",
  "Correction: Subtraction för ljusföroreningar; Division bara för vinjettering som flats inte tagit bort.",
  "Kontrollera resultatet med en kraftig ScreenTransferFunction: himlen ska se jämn ut.",
]
siril = [
  "På den linjära bilden: Image Processing › Background Extraction › GraXpert (AI), eller RBF-bakgrundsextraheringen med punkter på tom himmel.",
  "Correction: Subtraction.",
  "Kontrollera med en kraftig autostretch-visning: himlen ska se jämn ut.",
]
capture = [
  "Ta flats för varje session utan att ändra fokus eller kamerarotation emellan.",
  "Fotografera objektet när det står som högst och långt från månen och stadsljus.",
]

[color_gradient]
why = "Bakgrunden byter färg över bilden (upp till {color_gradient_pct} % mellan kanalerna). Ljusföroreningar och månljus är sällan neutrala, så ena sidan får en annan ton."
pixinsight = [
  "Bakgrundsextrahering per kanal på den linjära mastern (GraXpert eller DBE med Subtraction).",
  "Sedan BackgroundNeutralization eller SPCC med en bakgrundsreferens på tom himmel.",
]
siril = [
  "Background Extraction på den linjära bilden (GraXpert eller RBF), sedan Color Calibration med en bakgrundsreferens.",
]

[color_cast]
why = "Bakgrunden har en {cast_name} ton (kanalerna skiljer sig med {cast_pct} % av fullskala). En neutral mörkgrå himmel låter objektets verkliga färger träda fram."
pixinsight = [
  "Före sträckningen: BackgroundNeutralization med en preview på tom himmel, eller SPCC med dess bakgrundsreferens.",
  "Efter sträckningen: CurvesTransformation per kanal, sänk skuggorna i kurvan för {cast_channel} lite tills himlen är neutral.",
]
siril = [
  "Före sträckningen: Color Calibration › Background Neutralization på en markering av tom himmel.",
  "Efter sträckningen: Curves per kanal, sänk skuggorna för {cast_channel} lite.",
]

[green_cast]
why = "Himlen har en grön ton. Grönt är ovanligt i djuprymdsobjekt, så betraktare uppfattar det som ett fel; det kommer oftast från kamerans färgkänslighet eller ljusföroreningar."
pixinsight = [
  "SCNR: Color to remove Green, Protection method Average Neutral, Amount 0,6–1,0.",
  "Använd på den linjära bilden efter färgkalibreringen, eller på den sträckta bilden med lägre Amount.",
]
siril = [
  "Image Processing › Remove Green Noise (SCNR): Average Neutral, amount 0,6–1,0.",
]

[noise]
why = "Korn syns i bakgrunden (brus ungefär {noise_pct} % av fullskala). Sträckningen förstärker bruset; lösningen är en mild brusreducering, starkast i himlen och svagast på objektet, och mer integrationstid."
pixinsight = [
  "Arbeta på den linjära bilden, efter bakgrundsextrahering och färgkalibrering.",
  "Gör en inverterad luminansmask (recept nedan) så att brusreduceringen verkar på himlen och skonar objektet.",
  "MultiscaleLinearTransform genom masken: Algorithm Multiscale linear, 4 lager, Noise reduction på för lager 1–4 med gränser 3 / 2 / 1 / 0,5 och amount 0,5 / 0,5 / 0,5 / 0,5. Förhandsgranska på ett litet område först (Real-Time Preview).",
  "Eller TGVDenoise genom samma mask: Strength 5, Edge protection ungefär 2×10⁻³, 300 iterationer; sänk Strength om himlen blir slät och plastig.",
  "Jaga inte en helt slät bakgrund: ett fint, jämnt korn ser naturligt ut och döljer fläckar.",
]
"pixinsight@NoiseXTerminator" = [
  "NoiseXTerminator på den linjära bilden, efter bakgrundsextraheringen: Denoise 0,6–0,8, Detail 0,15. Den behåller detaljer bra på egen hand, så en mask är valfri.",
  "Om himlen fortfarande ser kornig ut efter sträckningen: en andra, lätt omgång (Denoise 0,3) genom en inverterad luminansmask (recept nedan).",
]
siril = [
  "Image Processing › Denoise: NL-Bayes, modulation 0,7–1,0, på den linjära eller lätt sträckta bilden.",
  "För att hålla objektet skarpt, brusreducera en kopia och blanda tillbaka den med PixelMath så att den bara når de mörka områdena (recept nedan).",
]
"siril@NoiseXTerminator" = [
  "NoiseXTerminator fungerar inte i Siril. Använd Denoise (NL-Bayes, modulation 0,7–1,0) eller GraXperts AI-brusreducering och blanda sedan in den i de mörka områdena med PixelMath (recept nedan).",
]
"why#galaxy" = "Korn syns i bakgrunden (brus ungefär {noise_pct} % av fullskala). Runt en galax ligger de svaga yttre armarna och halon precis på brusnivån, så brusreduceringen måste vara mild där: för mycket suddar ut utkanterna."
capture = [
  "Mer integrationstid är det enda verkliga botemedlet: dubbel tid sänker bruset med ungefär 30 %.",
]

[color_noise]
why = "Kornet är färgat (röda, gröna och blå prickar i himlen). Färgbrus är den mest synliga sorten och den lättaste att ta bort utan att förlora detaljer."
pixinsight = [
  "MultiscaleLinearTransform bara på krominansen (Target: Chrominance), 4 lager, kraftiga gränser på lager 1–2.",
  "Eller ColorSaturation/CurvesTransformation som sänker mättnaden i de mörkaste tonerna genom en mask.",
]
"pixinsight@NoiseXTerminator" = [
  "NoiseXTerminator: höj färgseparationen (Enable color separation, färg-Denoise 0,9).",
]
siril = [
  "Denoise med 'Independent channel denoising' avslaget, eller sänk mättnaden i skuggorna med Color Saturation-verktygets background factor.",
]

[mottle]
why = "Bakgrunden visar fläckar några pixlar stora (mottle). Det är brus i större skala än det fina kornet. Brusreducering för fint korn (även NoiseXTerminator) lämnar det kvar, och kraftig utjämning gör det värre eftersom den tar bort kornet som dolde fläckarna. Mottle kommer också från kort total integrationstid, för lite dithring och bakgrundsextrahering med för många punkter."
pixinsight = [
  "Kontrollera först bakgrundsmodellen: öppna DBE- (eller GraXpert-) bakgrundsbilden med en kraftig STF. Visar den klumpar, använd färre punkter (15–25) på verkligt tom himmel och gör om extraheringen.",
  "Gör en inverterad luminansmask på den linjära bilden (recept nedan), så att bara himlen behandlas.",
  "MultiscaleLinearTransform genom masken, riktad mot de större skalorna: 6 lager, brusreducering AV på lager 1–2 (behåll det fina kornet), PÅ på lager 3–5 med gränser 3 / 2 / 1 och amount 0,7 / 0,6 / 0,5. Använd Real-Time Preview på en himmelsfläck och se fläckarna planas ut.",
  "Alternativ: TGVDenoise genom masken, Strength 3–6, med 'Local support' satt till luminansmaskbilden så att den anpassar sig efter ljusstyrkan.",
  "Avsluta med en mycket lätt omgång för fint korn (eller ingen). Målet är jämnt fint korn, inte en slät himmel.",
]
"pixinsight@NoiseXTerminator" = [
  "Kör NoiseXTerminator som vanligt för det fina kornet (Denoise 0,6–0,8), men inte starkare: den tar inte bort mottle.",
  "Sedan de större skalorna: inverterad luminansmask (recept nedan) och MultiscaleLinearTransform med brusreducering bara på lager 3–5 (gränser 3 / 2 / 1, amount 0,7 / 0,6 / 0,5).",
  "Kontrollera DBE:s eller GraXperts bakgrundsmodell efter klumpar; färre punkter på tom himmel undviker att skapa mottle.",
]
siril = [
  "Kontrollera bakgrundsextraheringen först: färre punkter, bara på tom himmel; eller använd GraXperts AI-bakgrund, som inte ger klumpar.",
  "Image Processing › Wavelets: sätt vikter under 1 för mellanlagren (lager 3–5 till ungefär 0,6–0,8) och 1 för lager 1–2. Det mjukar upp fläckskalan men behåller det fina kornet.",
  "Använd det på en kopia och blanda in den bara i de mörka områdena med PixelMath (recept nedan).",
]
capture = [
  "Dithra var 1–3:e delbild och samla fler: mottle minskar med kvadratroten ur den totala exponeringstiden (fyra gånger så många timmar halverar den).",
]

[plastic]
why = "Bakgrunden är nästan helt slät (brus {noise_pct} % av fullskala). Det uppfattas ofta som 'plastigt' eller målat, och mycket svaga detaljer försvinner med bruset."
pixinsight = [
  "Minska brusreduceringens styrka eller blanda tillbaka en del av originalet: PixelMath  0.8*denoised + 0.2*original.",
]
"pixinsight@NoiseXTerminator" = [
  "Sänk NoiseXTerminators Denoise till 0,5–0,7 och höj Detail; eller blanda tillbaka originalet med PixelMath.",
]
siril = [
  "Gör om Denoise med lägre modulation (0,5–0,7), eller blanda med originalet i PixelMath.",
]

[walking_noise]
why = "Bakgrundsbruset har en riktning (strimmor i ungefär {walking_angle}°). Mönstret kallas vandrande brus (walking noise): monteringen drev sakta åt ett håll och samma pixelfel smetades ut till linjer."
pixinsight = [
  "Stapla om med CosmeticCorrection och storskalig pixelavvisning på; WBPP:s 'Large-scale pixel rejection' hjälper.",
  "Drizzle-integrering kan minska det ytterligare om du dithrade.",
]
siril = [
  "Stapla om med kosmetisk korrigering från masterdarken och Winsorized sigma-avvisning.",
]
capture = [
  "Dithra var 1–3:e delbild (i NINA, ASIAIR eller PHD2) och använd guidning för att stoppa den långsamma driften.",
]

[hot_pixels]
why = "{hot_pixels} enstaka ljusa pixlar finns kvar i bilden. Det är sensorfel som kalibrering och stapling borde ta bort. Klicka Visa för att kontrollera dem först: om de markerade prickarna är enstaka, skarpa, ofta färgade pixlar är det heta pixlar; om de är små runda prickar på några pixlar är det svaga stjärnor och du kan bortse från detta."
pixinsight = [
  "Åtgärdas bäst vid staplingen: slå på CosmeticCorrection i WBPP (Auto detect, Hot sigma 3, Cold sigma 3) och använd en pixelavvisningsmetod (Generalized Extreme Studentized Deviate eller Winsorized sigma clipping). Stapla om.",
  "På den färdiga bilden: CosmeticCorrection med 'Use Auto detect' och Hot sigma 3–5, använd direkt. Kontrollera med avläsningen att stjärnorna är orörda.",
  "Eller för hand: duplicera bilden och döp om kopian till med; använd MorphologicalTransformation (Operator Median, size 3) på med; sedan PixelMath på din bild: iif($T - med > 0.1, med, $T). Det ersätter bara pixlar som är mycket ljusare än omgivningen.",
]
siril = [
  "Åtgärdas bäst vid förbearbetningen: slå på Cosmetic Correction från masterdarken (hot sigma 3) i förbearbetningsfliken, och Winsorized sigma-avvisning vid staplingen.",
  "På den färdiga bilden: Image Processing › Cosmetic Correction (sigma 3–5 för heta pixlar).",
]
capture = [
  "Dithra mellan delbilderna så att heta pixlar hamnar på olika ställen på himlen och avvisas vid staplingen.",
  "Ta darks vid samma temperatur som ljusbilderna; en varmare sensor har många fler heta pixlar.",
]

[stars_soft]
why = "Stjärnorna är i det större laget (median {fwhm} pixlar breda vid halva ljusstyrkan). Stora stjärnor drar blicken från objektet och döljer svaga detaljer runt dem."
pixinsight = [
  "Dekonvolution på den linjära bilden med en PSF gjord med skriptet PSFImage, 20–40 iterationer, med deringing, genom en stjärnmask.",
  "Efter sträckningen: separera stjärnorna (StarNet2), sträck stjärnbilden mindre och sätt ihop med PixelMath: ~((~starless)*(~stars)).",
  "Eller MorphologicalTransformation (Morphological Selection, Selection 0,3, size 3–5, Amount 0,3–0,5) genom en stjärnmask (recept nedan).",
]
"pixinsight@BlurXTerminator" = [
  "BlurXTerminator på den linjära bilden: Sharpen Stars 0,25–0,5, Adjust Star Halos -0,1 till -0,2.",
  "Efter sträckningen: separera stjärnorna och sträck dem mindre innan du sätter ihop.",
]
siril = [
  "Dekonvolution (Richardson-Lucy, PSF från stjärnor) på den linjära bilden.",
  "Efter sträckningen: StarNet Star Removal, sträck stjärnorna mindre och sätt ihop med Star Recomposition (recept nedan).",
]
capture = [
  "Kontrollera fokus under natten; temperaturändringar flyttar det. En Bahtinovmask eller autofokus var 1–2:a timme, eller efter en ändring på 1–2 °C, hjälper.",
]

[big_stars]
why = "De ljusaste stjärnorna är stora klumpar (ungefär {fwhm_bright} pixlar breda), så de dominerar bilden."
pixinsight = [
  "Separera stjärnorna med StarNet2 (eller StarXTerminator), sträck stjärnbilden mindre och sätt ihop med PixelMath: ~((~starless)*(~stars)).",
  "Eller MorphologicalTransformation (Morphological Selection 0,3, size 5) genom en stjärnmask (recept nedan) som bara innehåller de ljusaste stjärnorna: höj StarMasks noise threshold tills svaga stjärnor faller bort.",
]
"pixinsight@StarXTerminator" = [
  "StarXTerminator med 'Generate star image'; sträck stjärnorna mindre och sätt ihop med PixelMath: ~((~starless)*(~(stars*0.7))).",
]
siril = [
  "StarNet Star Removal; sedan Star Recomposition med svagare stjärnsträckning.",
]
"why#cluster" = "De ljusaste stjärnorna är stora klumpar (ungefär {fwhm_bright} pixlar breda). I en stjärnhop är stjärnorna motivet, så deras storlek och färg är viktigast: täta, ljusa stjärnor med synlig färg ser bäst ut."

[star_dominance]
why = "Stjärnorna täcker ungefär {star_area} % av bilden. I rika Vintergatsfält är det naturligt, men att dämpa dem låter nebulosan ta plats i centrum."
pixinsight = [
  "Stjärnreducering: StarNet2 eller StarXTerminator, och sätt sedan tillbaka stjärnorna med 60–80 % styrka.",
  "Eller MorphologicalTransformation genom en stjärnmask.",
]
siril = [
  "StarNet Star Removal, sedan Star Recomposition med dämpade stjärnor.",
]

[trailed_stars]
why = "Stjärnorna är utdragna i samma riktning över hela bilden (utdragning {ellipticity}). Det pekar på följningen: guidningsfel, vind, balans eller polinställning."
pixinsight = [
  "Stapla om med bara de delbilder som har runda stjärnor: SubframeSelector (Eccentricity under 0,5) eller AdvAstros urval av delbilder.",
  "Lätt utdragning kan minskas efteråt med BlurXTerminator (den rättar icke-runda stjärnor) eller MorphologicalTransformation.",
]
"pixinsight@BlurXTerminator" = [
  "BlurXTerminator rättar lätt utdragning: Correct Only först, sedan Sharpen Stars 0,25.",
  "Stapla om utan de sämsta delbilderna: SubframeSelector eller AdvAstros urval av delbilder.",
]
siril = [
  "Stapla om utan de sämsta delbilderna: i sekvensens bildlista, sortera efter rundhet och avmarkera de sämsta.",
]
capture = [
  "Kontrollera guidningen (RMS under halva din bildskala), balansera lite östtungt och gör om polinställningen.",
  "Kortare delbilder minskar effekten av vind och periodiskt fel.",
]

[corner_stars]
why = "Stjärnorna i hörnen är {corner_pct} % större än i mitten{shape}. Optiken ger inte ett plant, skarpt fält ända ut till kanterna: oftast flattenerns eller reducerns avstånd, eller ingen flattener alls."
pixinsight = [
  "Titta på en enda delbild med Script › Image Analysis › AberrationInspector för att se mönstret: utdragna mot mitten = för långt eller kort avstånd; utdragna längs cirklar = fältkrökning.",
  "Reparera den här bilden: DynamicCrop för att skära bort de sämsta hörnen, eller krymp stjärnorna där med MorphologicalTransformation genom en stjärnmask (recept nedan).",
]
"pixinsight@BlurXTerminator" = [
  "BlurXTerminator rättar koma och astigmatism per område: kör den på den linjära bilden med Correct Only först.",
  "Beskär det som är kvar med DynamicCrop.",
]
siril = [
  "Beskär bort de sämsta hörnen, eller dämpa stjärnorna efter StarNet-separationen (Star Recomposition).",
]
capture = [
  "{capture_hint}",
]

[corner_elongation]
why = "Stjärnorna är utdragna bara i {corner} hörnet (utdragning {ecc}, mot ett runt centrum). Ett enda dåligt hörn betyder oftast lutning, en flattener eller reducer på fel avstånd med den optiska axeln ur centrum, kollimering, eller ett klämt eller förskjutet optiskt element. Roterade delbilder i stapeln kan också ge ett utdraget hörn där du inte väntar dig det."
pixinsight = [
  "Titta på utdragningens riktning med Script › Image Analysis › AberrationInspector på en enda delbild: stjärnor som pekar mot mitten betyder avstånd (back focus); stjärnor utdragna längs cirklar betyder fältkrökning eller astigmatism; bara ett hörn betyder lutning eller en komponent ur axeln.",
  "Reparera den här bilden: beskär bort hörnet med DynamicCrop om kompositionen tillåter.",
  "Eller reparera lokalt: gör en hörnmask och en stjärnmask (recept nedan), multiplicera dem i PixelMath (corner*stars) så att bara stjärnorna i det hörnet är vita, och använd MorphologicalTransformation (Morphological Selection 0,3–0,5, size 3) genom den.",
]
"pixinsight@BlurXTerminator" = [
  "BlurXTerminator på den linjära bilden (Correct Only först): den rättar utdragning per område, även i ett enda hörn.",
  "Beskär det som är kvar med DynamicCrop.",
  "Kontrollera en enda delbild med AberrationInspector för att hitta orsaken till nästa session.",
]
siril = [
  "Beskär bort hörnet (Image › Crop), eller dämpa stjärnorna där efter StarNet-separation och Star Recomposition.",
  "Kontrollera en enda delbild med Analysis › Image Analysis (Aberration Inspector) för att se orsaken.",
]
capture = [
  "Förebygg det: ställ in flattenerns eller reducerns avstånd exakt (ofta 55 mm från gängan till sensorn), se till att kameran och korrektorn sitter rakt utan glapp, och använd kamerans tiltplatta om den har en.",
  "Testa efter varje ändring med en delbild och aberrationsinspektören, innan en hel natts fotografering.",
