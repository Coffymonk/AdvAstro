]

[low_detail]
why = "Fin struktur höjer sig knappt över bruset (detaljkvot {detail_ratio}). Objektet ser mjukt eller platt ut. Skärp bara objektet, genom en mask, så att himlens brus inte växer."
pixinsight = [
  "Dekonvolution på den linjära bilden först: PSFImage (skript) för att mäta dina stjärnor, sedan Deconvolution med den PSF:en, 20–40 iterationer, Deringing på, genom en luminansmask (recept nedan).",
  "Efter sträckningen: LocalHistogramEqualization (Kernel radius 64–128, Contrast limit 1,5–2, Amount 0,2–0,35) genom en range-mask på objektet (recept nedan).",
  "Eller MultiscaleLinearTransform med Bias 0,05–0,1 på lager 2–4 genom samma mask.",
]
"pixinsight@BlurXTerminator" = [
  "BlurXTerminator på den linjära bilden: Sharpen Nonstellar 0,3–0,6 (den skyddar himlen av sig själv).",
  "Efter sträckningen: LocalHistogramEqualization (radie 64–128, amount 0,25) genom en range-mask på objektet (recept nedan).",
]
siril = [
  "Dekonvolution (Richardson-Lucy, PSF från stjärnor) på den linjära bilden.",
  "Efter sträckningen: CLAHE (tile size 8–16, clip limit 1,5–2) på det stjärnlösa objektet; blanda tillbaka med PixelMath om himlen blir brusig (recept nedan).",
]

[low_contrast]
why = "Objektet höjer sig knappt över bakgrunden (bara {contrast_pct} % av fullskala). Bilden ser mörk och platt ut; det finns utrymme att sträcka mer."
pixinsight = [
  "En till mild sträckning (GeneralizedHyperbolicStretch med highlight protection) eller ett lyft av mellantonerna med CurvesTransformation.",
  "Sedan kontrast i objektet: LocalHistogramEqualization genom en mask, eller HDRMultiscaleTransform för ljusa kärnor.",
]
siril = [
  "Generalized Hyperbolic Stretch: ytterligare en liten sträckning med highlight protection.",
  "Sedan CLAHE på objektet för lokal kontrast.",
]

[clipped_highlights]
why = "Ljusa delar av objektet är utbrända ({extended_clip_px} pixlar helt vita utanför stjärnkärnorna). Strukturen i det ljusaste området är förlorad."
pixinsight = [
  "Gå tillbaka till den linjära bilden och sträck med highlight protection (GeneralizedHyperbolicStretch: Highlight protection 0,9).",
