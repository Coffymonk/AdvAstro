[tilt]
why = "Ett hörn är tydligt skarpare än det motsatta (de skiljer sig med {tilt_pct} %). Sensorlutning är skolboksorsaken, men lika vanliga är: back focus lite fel med den optiska axeln ur centrum på sensorn; kollimering (reflektorer, RASA, SCT); en klämd eller förskjuten lins eller korrektor; böjning i fokuseraren eller kamerakedjan; och staplingen — delbilder roterade mellan nätter eller efter en meridianvändning blandar olika hörn, och en beskärning ur centrum får det att se ensidigt ut."
pixinsight = [
  "Ta först reda på om det sitter i optiken eller i stapeln: öppna en enda kalibrerad delbild och kör Script › Image Analysis › FWHMEccentricity. Är den enskilda delbilden jämn är orsaken staplingen eller beskärningen, inte kameran.",
  "Om den enskilda delbilden också visar det: Script › Image Analysis › AberrationInspector gör en 3×3-mosaik av hörnen och mitten, så att du ser åt vilket håll stjärnorna dras ut.",
  "För den här bilden: BlurXTerminator (Correct Only) jämnar ut oskärpa per område; annars beskär den mjukaste kanten med DynamicCrop, eller krymp stjärnorna där genom en hörnmask (recept nedan) kombinerad med en stjärnmask.",
]
"pixinsight@BlurXTerminator" = [
  "Kontrollera en enda kalibrerad delbild med Script › Image Analysis › FWHMEccentricity eller AberrationInspector: sitter oskärpan i optiken, eller bara i stapeln?",
  "För den här bilden: BlurXTerminator på den linjära bilden, Correct Only först; den rättar oskärpa och utdragning per område. Beskär det som är kvar med DynamicCrop.",
]
siril = [
  "Kontrollera en enda delbild: Analysis › Image Analysis (Aberration Inspector) eller Dynamic PSF i varje hörn. Jämn i en enskild delbild betyder att stapeln eller beskärningen orsakar det.",
  "För den här bilden: beskär den mjukaste kanten (Image › Crop).",
]
capture = [
  "Skilj orsakerna åt: vrid kameran 90° och ta en delbild. Ett mjukt hörn som följer med kameran sitter på kamerasidan (lutning, adapter, avstånd); ett som stannar kvar sitter i teleskopet (kollimering, klämd optik).",
  "Back focus: placera sensorn på exakt det avstånd din flattener eller reducer kräver (ofta 55 mm); en millimeter fel syns som mjuka eller utdragna hörn.",
  "Kontrollera glapp i fokuseraren och kamerans anslutning, och dra åt linsfattningar bara med fingrarna.",
]

[star_rings]
why = "{ring_pct} % av de ljusa stjärnorna har en mörk ring runt sig. Ringar kommer från överskärpning eller för många dekonvolutionsiterationer, och är bland det första erfarna betraktare lägger märke till."
pixinsight = [
  "Gör om dekonvolutionen med färre iterationer och Deringing på (global dark 0,02–0,05, med en stjärnmask).",
  "Sänk styrkan i skärpningen med UnsharpMask / MultiscaleLinearTransform och använd den genom en mask som utesluter stjärnorna.",
]
"pixinsight@BlurXTerminator" = [
  "Sänk BlurXTerminators Sharpen Stars (0,2–0,3) och undvik extra skärpning ovanpå.",
  "Skärp bara detaljer som inte är stjärnor, genom en stjärnmask.",
]
siril = [
  "Gör om dekonvolutionen med färre iterationer, eller använd Unsharp Mask mildare och bara på den stjärnlösa bilden.",
]

[star_color]
why = "Stjärnorna ser nästan färglösa ut (färgspridning {color_spread}). Verkliga stjärnor går från blåvita till orange; den variationen får en bild att kännas naturlig och djup."
pixinsight = [
  "Färgkalibrera med SPCC på den linjära datan.",
  "Sträck stjärnorna för sig med ArcsinhStretch, som behåller färgen i stjärnorna.",
  "Öka mättnaden bara på stjärnorna, genom en stjärnmask (CurvesTransformation, mättnadskurvan).",
]
siril = [
  "Spectrophotometric Color Calibration, sedan Asinh Transformation för stjärnorna (den bevarar färgen).",
  "Color Saturation på stjärnbilden efter StarNet-separationen.",
]

[white_cores]
why = "De flesta ljusa stjärnorna har helt vita, klippta kärnor. Färgen försvinner i mitten, vilket får stjärnorna att se ut som hål i bilden."
pixinsight = [
  "Sträck stjärnorna med ArcsinhStretch i stället för en vanlig histogramsträckning.",
  "Eller separera stjärnorna och använd en mildare sträckning för stjärnbilden.",
]
siril = [
  "Använd Asinh Transformation på stjärnorna (med alternativet 'Use RGB working space') i stället för en kraftig histogramsträckning.",
]

[magenta_stars]
why = "Många stjärnor är magentafärgade. Det är typiskt för smalbands- eller dual-band-data, där stjärnorna är svaga i den gröna kanalen."
pixinsight = [
  "Invertera bilden, använd SCNR (green, amount 0,5–0,8) och invertera tillbaka: det tar bort magenta.",
  "Eller ersätt stjärnorna med RGB-stjärnor tagna med ett bredbandsfilter.",
]
siril = [
  "Negative transformation, sedan Remove Green Noise (SCNR), sedan negativ igen.",
]

[fringe]
why = "Stjärnorna har en {fringe_color} kant: en färg är större än de andra. Det är kromatisk aberration i optiken, eller kanaler som passats ihop lite olika."
pixinsight = [
  "Passa ihop kanalerna med varandra (ChannelExtraction, StarAlignment av R och B mot G, ChannelCombination).",
  "Dämpa kantfärgen på stjärnorna genom en stjärnmask (CurvesTransformation på den nyansen, eller SCNR för gröna kanter).",
]
siril = [
  "Dela upp kanalerna, registrera dem mot den gröna kanalen och sätt ihop dem igen.",
]
capture = [
  "Med en dublett eller ett kameraobjektiv minskar ett smalbands- eller UV/IR-spärrfilter kanten.",
]

[muted]
why = "Färgerna är dämpade (medianmättnad {saturation_pct} %). Objektet ser gråare ut än det är. Höj mättnaden bara på objektet: i himlen skulle den ta fram färgbrus."
pixinsight = [
  "Se till att färgkalibreringen gjordes på den linjära datan (SpectrophotometricColorCalibration); mättnad kan inte rätta en fel färgbalans.",
  "Gör en luminansmask (recept nedan) så att bakgrunden skyddas.",
  "CurvesTransformation genom masken, S-kanalen (mättnad): dra upp linjens mitt lite (ungefär 0,5 → 0,6). Använd 2–3 gånger hellre än en gång kraftigt.",
  "Eller ColorSaturation genom masken, och höj kurvan bara vid ditt objekts nyanser.",
]
siril = [
  "Image Processing › Color Saturation: amount 0,3–0,6, med Background factor ungefär 1,5 så att himlen skyddas.",
  "Upprepa i små steg hellre än ett stort.",
]
"why#galaxy" = "Färgerna är dämpade (medianmättnad {saturation_pct} %). Galaxer är diskreta: en gulaktig kärna, blåaktiga armar och små rosa stjärnbildningsområden. Den variationen får en galax att se verklig ut; den kräver bra färgkalibrering och lite mättnad bara på galaxen."
"pixinsight#galaxy" = [
  "SpectrophotometricColorCalibration på den linjära datan, sedan BackgroundNeutralization om himlen inte är neutral.",
  "Gör en range-mask på galaxen (recept nedan) så att bara galaxen får mättnaden.",
  "CurvesTransformation, mättnadskanalen, små lyft genom masken. Se de rosa HII-områdena och de blå armarna framträda, och sluta innan kärnan blir orange.",
]
"siril#galaxy" = [
  "Spectrophotometric Color Calibration på den linjära datan.",
  "Color Saturation, amount 0,3–0,5 med Background factor 2, i små steg.",
]

[oversaturated]
why = "Färgerna är mycket hårt drivna ({sat_high} % av objektet är nära full mättnad). Det ser skrikigt ut och döljer objektets diskreta variationer."
pixinsight = [
  "Backa mättnadssteget; använd mättnad i två eller tre små steg i stället för ett stort.",
  "Använd en luminansmask för att hålla mättnaden borta från de ljusaste delarna.",
]
siril = [
