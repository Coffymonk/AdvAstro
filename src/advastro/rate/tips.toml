# "How to improve this image" knowledge for Rate my pic.
#
# One table per finding id (see judge.py). Fields:
#   why        what causes it (one or two sentences)
#   pixinsight list of steps; {placeholders} are measured values
#   siril      list of steps
#   <tool>@<add-on>  steps used instead when the user owns that add-on
#                    (add-ons come from Settings › Your software)
#   capture    what to do differently at the telescope (optional)
#   masks      mask recipes the steps use (masks.toml), shown under the steps
#   why#<kind>, <tool>#<kind>, <tool>@<add-on>#<kind>
#              variants for an object type: galaxy, emission, reflection, planetary,
#              dark, cluster, globular, milkyway
#
# Placeholders available everywhere: sky_pct, target_sky, noise_pct, fwhm, gradient_pct,
# saturation_pct, plus finding-specific ones listed next to each table.

[linear]
why = "The data is still linear: the faint signal is there but has not been brought into view. Every other judgement is made on an automatic stretch."
pixinsight = [
  "Background and colour first, while linear: GraXpert or DynamicBackgroundExtraction, then SpectrophotometricColorCalibration.",
  "Stretch with GeneralizedHyperbolicStretch (several gentle passes, symmetry point at the background peak) or HistogramTransformation via a ScreenTransferFunction preview.",
  "Aim for a background around {target_sky} % brightness.",
]
siril = [
  "Remove the gradient (Background Extraction or GraXpert), then Photometric/Spectrophotometric Color Calibration.",
  "Stretch with Generalized Hyperbolic Stretch, or Asinh Transformation followed by Histogram Transformation.",
  "Aim for a background around {target_sky} % brightness.",
]

[crushed_black]
why = "The black point is set too high: the darkest sky has been cut to pure black, which takes faint stars, the faint outer nebulosity and any natural texture with it ({black_clip} % of the pixels are clipped)."
pixinsight = [
  "Go back to the version before the final curves or levels step.",
  "HistogramTransformation: move the shadows slider left until the readout shows no (or only a few) clipped pixels.",
  "CurvesTransformation: lift the lowest point of the curve slightly so the background sits near {target_sky} %.",
]
siril = [
  "Undo the last levels or curves step.",
  "Histogram Transformation: lower the shadows value until the clipping percentage is close to zero.",
  "Curves: raise the bottom end a little so the background lands near {target_sky} %.",
]

[dark_background]
why = "The background sits at {sky_pct} %. That looks dramatic on a bright screen, but faint stars and the outer, faint nebulosity sink into black, and on darker screens the image looks empty."
pixinsight = [
  "CurvesTransformation: lift the shadows slightly (a point at input 0.05 raised to about 0.08).",
  "Or a final HistogramTransformation with a small midtones move to the left.",
  "Target: background around {target_sky} %, measured with the readout on an empty patch of sky.",
]
siril = [
  "Curves: lift the lower part of the curve slightly.",
  "Or Histogram Transformation with a small midtones change.",
  "Target: background around {target_sky} %.",
]

[bright_background]
why = "The background sits at {sky_pct} %. A grey sky lowers contrast and makes the image look hazy or washed out."
pixinsight = [
  "HistogramTransformation: move the shadows slider right until the background drops to about {target_sky} %, watching the clipping count.",
  "Or CurvesTransformation with a slight S-curve that darkens the shadows and keeps the midtones.",
]
siril = [
  "Histogram Transformation: raise the shadows value until the background drops to about {target_sky} %.",
  "Or Curves with a gentle S-curve.",
]

[shadow_clip]
why = "{black_clip} % of the pixels have at least one colour clipped to zero. Clipped shadows turn the sky blotchy and lose faint colour."
pixinsight = [
  "Lower the black point of the last stretch slightly until clipping falls below 0.1 %.",
  "If one channel clips first, neutralize the background before stretching (BackgroundNeutralization or SPCC's background step).",
]
siril = [
  "Lower the shadows value of the last stretch until clipping falls below 0.1 %.",
  "Neutralize the background before stretching (Color Calibration › Background).",
]

[gradient]
why = "The background brightness changes by {gradient_pct} % across the frame{direction}. Usually that is light pollution, moonlight or an imperfect flat. If the brightness change is real nebulosity, you can ignore this."
"why#emission" = "The background brightness changes by {gradient_pct} % across the frame{direction}. In a frame full of nebula, part of that can be faint nebulosity, which you want to keep: place background samples only where you are sure there is no nebula, or use fewer samples and a gentler model."
"why#milkyway" = "The brightness changes by {gradient_pct} % across the field{direction}. The Milky Way itself is a large brightness change; what to remove is light pollution and airglow on top of it."
"pixinsight#emission" = [
  "On the linear master: GraXpert with a low Smoothing value, or DynamicBackgroundExtraction with 10–20 samples placed only on dark gaps between the nebulosity (check each sample box: no nebula inside).",
  "Correction: Subtraction. Look at the background model image it produces: it should be a smooth slope with no nebula shapes in it. If you can see nebula in the model, remove those samples.",
  "Check the result with a strong STF: the dark gaps should be even, the nebula untouched.",
]
"siril#emission" = [
  "On the linear image: GraXpert (AI) background extraction, or the RBF method with few samples placed only on dark gaps between the nebulosity.",
  "Correction: Subtraction. Check that the background model shows no nebula shapes.",
]
pixinsight = [
  "Work on the linear master: GraXpert (AI background extraction) or DynamicBackgroundExtraction with 15–25 samples placed only on empty sky.",
  "Correction: Subtraction for light pollution; Division only for vignetting left over from flats.",
  "Check the result with a strong ScreenTransferFunction: the sky should look even.",
]
siril = [
  "On the linear image: Image Processing › Background Extraction › GraXpert (AI), or the RBF background extraction with samples on empty sky.",
  "Correction: Subtraction.",
  "Check with a strong autostretch view: the sky should look even.",
]
capture = [
  "Take flats for every session without changing the focus or camera rotation in between.",
  "Image the target when it is highest and away from the Moon and town glow.",
]

[color_gradient]
why = "The background changes colour across the frame (up to {color_gradient_pct} % between channels). Light pollution and moonlight are rarely neutral, so one side turns a different tint."
pixinsight = [
  "Background extraction per channel on the linear master (GraXpert or DBE with Subtraction).",
  "Then BackgroundNeutralization or SPCC with a background reference on empty sky.",
]
siril = [
  "Background Extraction on the linear image (GraXpert or RBF), then Color Calibration with a background reference.",
]

[color_cast]
why = "The background is tinted {cast_name} (the channels differ by {cast_pct} % of full scale). A neutral dark grey sky lets the real colours of the object stand out."
pixinsight = [
  "Before stretching: BackgroundNeutralization with a preview on empty sky, or SPCC with its background reference.",
  "After stretching: CurvesTransformation per channel, lowering the {cast_channel} curve's shadows slightly until the sky is neutral.",
]
siril = [
  "Before stretching: Color Calibration › Background Neutralization on an empty-sky selection.",
  "After stretching: Curves per channel, lowering the {cast_channel} shadows slightly.",
]

[green_cast]
why = "The sky has a green tint. Green is rare in deep-sky objects, so viewers read it as an error; it usually comes from the camera's colour response or light pollution."
pixinsight = [
  "SCNR: Color to remove Green, Protection method Average Neutral, Amount 0.6–1.0.",
  "Apply on the linear image after colour calibration, or on the stretched image with lower Amount.",
]
siril = [
  "Image Processing › Remove Green Noise (SCNR): Average Neutral, amount 0.6–1.0.",
]

[noise]
why = "Grain is visible in the background (noise about {noise_pct} % of full scale). Stretching amplifies noise; the fix is gentle noise reduction, strongest in the sky and weakest on the object, and more integration time."
masks = ["inverted_luminance"]
pixinsight = [
  "Work on the linear image, after background extraction and colour calibration.",
  "Make an inverted luminance mask (recipe below) so the noise reduction acts on the sky and spares the object.",
  "MultiscaleLinearTransform through the mask: Algorithm Multiscale linear, 4 layers, Noise reduction on for layers 1–4 with thresholds 3 / 2 / 1 / 0.5 and amounts 0.5 / 0.5 / 0.5 / 0.5. Preview on a small area first (Real-Time Preview).",
  "Or TGVDenoise through the same mask: Strength 5, Edge protection about 2×10⁻³, 300 iterations; lower Strength if the sky turns smooth and plastic.",
  "Do not chase a perfectly smooth background: a fine, even grain looks natural and hides blotches.",
]
"pixinsight@NoiseXTerminator" = [
  "NoiseXTerminator on the linear image, after background extraction: Denoise 0.6–0.8, Detail 0.15. It keeps detail well on its own, so a mask is optional.",
  "If the sky still looks grainy after the stretch: a second, light pass (Denoise 0.3) through an inverted luminance mask (recipe below).",
]
siril = [
  "Image Processing › Denoise: NL-Bayes, modulation 0.7–1.0, on the linear or lightly stretched image.",
  "To keep the object crisp, denoise a copy and blend it back with PixelMath so it only reaches the dark areas (recipe below).",
]
"siril@NoiseXTerminator" = [
  "NoiseXTerminator does not run in Siril. Use Denoise (NL-Bayes, modulation 0.7–1.0) or GraXpert's AI denoise, then blend it into the dark areas with PixelMath (recipe below).",
]
"why#galaxy" = "Grain is visible in the background (noise about {noise_pct} % of full scale). Around a galaxy the faint outer arms and halo sit right at the noise level, so noise reduction must be gentle there: too much erases the outskirts."
capture = [
  "More integration time is the only real cure: doubling it lowers the noise by about 30 %.",
]

[color_noise]
why = "The grain is coloured (red, green and blue speckles in the sky). Colour noise is the most visible kind and the easiest to remove without losing detail."
masks = ["inverted_luminance"]
pixinsight = [
  "MultiscaleLinearTransform on chrominance only (Target: Chrominance), 4 layers, strong thresholds on layers 1–2.",
  "Or ColorSaturation/CurvesTransformation lowering saturation in the darkest tones through a mask.",
]
"pixinsight@NoiseXTerminator" = [
  "NoiseXTerminator: raise the colour separation option (Enable color separation, colour Denoise 0.9).",
]
siril = [
  "Denoise with 'Independent channel denoising' off, or reduce saturation in the shadows with the Color Saturation tool's background factor.",
]

[mottle]
why = "The background shows blotches a few pixels across (mottle). That is noise at a larger scale than the fine grain. Fine-grain noise reduction (including NoiseXTerminator) leaves it in place, and strong smoothing makes it worse because it removes the grain that hid the blotches. Mottle also comes from short total integration, from too little dithering, and from background extraction with too many samples."
masks = ["inverted_luminance"]
pixinsight = [
  "First check the background model: open your DBE (or GraXpert) background image with a strong STF. If it shows lumps, use fewer samples (15–25) on truly empty sky, and redo the extraction.",
  "On the linear image, make an inverted luminance mask (recipe below), so only the sky is treated.",
  "MultiscaleLinearTransform through the mask, aimed at the larger scales: 6 layers, noise reduction OFF on layers 1–2 (leave the fine grain), ON on layers 3–5 with thresholds 3 / 2 / 1 and amounts 0.7 / 0.6 / 0.5. Use Real-Time Preview on a patch of sky and watch the blotches flatten.",
  "Alternative: TGVDenoise through the mask, Strength 3–6, with 'Local support' set to the luminance mask image so it adapts to brightness.",
  "Finish with a very light fine-grain pass (or none). The aim is even fine grain, not a smooth sky.",
]
"pixinsight@NoiseXTerminator" = [
  "Run NoiseXTerminator as usual for the fine grain (Denoise 0.6–0.8), but no stronger: it does not remove mottle.",
  "Then the larger scales: inverted luminance mask (recipe below), and MultiscaleLinearTransform with noise reduction only on layers 3–5 (thresholds 3 / 2 / 1, amounts 0.7 / 0.6 / 0.5).",
  "Check the DBE or GraXpert background model for lumps; fewer samples on empty sky avoid creating mottle.",
]
siril = [
  "Check the background extraction first: fewer samples, only on empty sky; or use GraXpert's AI background, which does not make lumps.",
  "Image Processing › Wavelets: set weights below 1 for the middle layers (layers 3–5 to about 0.6–0.8) and 1 for layers 1–2. That softens the blotch scale but keeps fine grain.",
  "Apply it to a copy and blend it into the dark areas only with PixelMath (recipe below).",
]
capture = [
  "Dither every 1–3 subs, and collect more of them: mottle shrinks with the square root of total exposure time (four times the hours halves it).",
]

[plastic]
why = "The background is almost perfectly smooth (noise {noise_pct} % of full scale). That often reads as 'plastic' or painted, and very faint detail goes with the noise."
pixinsight = [
  "Reduce noise reduction strength or blend some of the original back: PixelMath  0.8*denoised + 0.2*original.",
]
"pixinsight@NoiseXTerminator" = [
  "Lower NoiseXTerminator's Denoise to 0.5–0.7 and raise Detail; or blend the original back in with PixelMath.",
]
siril = [
  "Redo Denoise with a lower modulation (0.5–0.7), or blend with the original in PixelMath.",
]

[walking_noise]
why = "The background noise has a direction (streaks at about {walking_angle}°). That pattern is called walking noise: the mount drifted slowly in one direction and the same pixel defects smeared into lines."
pixinsight = [
  "Restack with CosmeticCorrection and large-scale pixel rejection on; WBPP's 'Large-scale pixel rejection' helps.",
  "Drizzle integration can reduce it further if you dithered.",
]
siril = [
  "Restack with cosmetic correction from the master dark and Winsorized sigma rejection.",
]
capture = [
  "Dither every 1–3 subs (in NINA, ASIAIR or PHD2), and use guiding to stop the slow drift.",
]

[hot_pixels]
why = "{hot_pixels} single bright pixels survive in the image. They are sensor defects that calibration and stacking should remove. Click Show to check them first: if the marked dots are single, sharp, often coloured pixels, they are hot pixels; if they are tiny round dots of a few pixels, they are faint stars and you can ignore this finding."
pixinsight = [
  "Best fixed at stacking: in WBPP, enable CosmeticCorrection (Auto detect, Hot sigma 3, Cold sigma 3), and use a pixel rejection method (Generalized Extreme Studentized Deviate or Winsorized sigma clipping). Restack.",
  "On the finished image: CosmeticCorrection with 'Use Auto detect' and Hot sigma 3–5, applied directly. Check with the readout that stars are untouched.",
  "Or by hand: duplicate the image and rename the copy med; apply MorphologicalTransformation (Operator Median, size 3) to med; then PixelMath on your image: iif($T - med > 0.1, med, $T). It replaces only pixels that are much brighter than their surroundings.",
]
siril = [
  "Best fixed at preprocessing: enable Cosmetic Correction from the master dark (hot sigma 3) in the preprocessing tab, and Winsorized sigma rejection when stacking.",
  "On the finished image: Image Processing › Cosmetic Correction (sigma 3–5 for hot pixels).",
]
capture = [
  "Dither between subs so hot pixels land on different sky positions and are rejected during stacking.",
  "Take darks at the same temperature as the lights; a warmer sensor has many more hot pixels.",
]

[stars_soft]
why = "Stars are on the large side (median {fwhm} pixels across at half brightness). Large stars draw the eye away from the object and hide faint detail around them."
masks = ["star"]
pixinsight = [
  "Deconvolution on the linear image with a PSF made by the PSFImage script, 20–40 iterations, with deringing, through a star mask.",
  "After the stretch: separate the stars (StarNet2), stretch the star image less, and recombine with PixelMath: ~((~starless)*(~stars)).",
  "Or MorphologicalTransformation (Morphological Selection, Selection 0.3, size 3–5, Amount 0.3–0.5) through a star mask (recipe below).",
]
"pixinsight@BlurXTerminator" = [
  "BlurXTerminator on the linear image: Sharpen Stars 0.25–0.5, Adjust Star Halos -0.1 to -0.2.",
  "After the stretch: separate the stars and stretch them less before recombining.",
]
siril = [
  "Deconvolution (Richardson-Lucy, PSF from stars) on the linear image.",
  "After the stretch: StarNet Star Removal, stretch the stars less, and recombine with Star Recomposition (recipe below).",
]
capture = [
  "Check focus during the night; temperature changes shift it. A Bahtinov mask or autofocus every 1–2 hours, or after a 1–2 °C change, helps.",
]

[big_stars]
why = "The brightest stars are large blobs (about {fwhm_bright} pixels across), so they dominate the picture."
masks = ["star"]
pixinsight = [
  "Separate stars with StarNet2 (or StarXTerminator), stretch the star image less, and recombine with PixelMath: ~((~starless)*(~stars)).",
  "Or MorphologicalTransformation (Morphological Selection 0.3, size 5) through a star mask (recipe below) that only holds the brightest stars: raise StarMask's noise threshold until faint stars drop out.",
]
"pixinsight@StarXTerminator" = [
  "StarXTerminator with 'Generate star image'; stretch the stars less and recombine with PixelMath: ~((~starless)*(~(stars*0.7))).",
]
siril = [
  "StarNet Star Removal; then Star Recomposition with a lower star stretch.",
]
"why#cluster" = "The brightest stars are large blobs (about {fwhm_bright} pixels across). In a star cluster the stars are the subject, so their size and colour matter most: tight bright stars with visible colour look best."

[star_dominance]
why = "Stars cover about {star_area} % of the frame. In rich Milky Way fields that is natural, but reducing them lets the nebula take centre stage."
masks = ["star"]
pixinsight = [
  "Star reduction: StarNet2 or StarXTerminator, then recombine the stars at 60–80 % strength.",
  "Or MorphologicalTransformation through a star mask.",
]
siril = [
  "StarNet Star Removal, then Star Recomposition with the stars dimmed.",
]

[trailed_stars]
why = "Stars are elongated in the same direction across the whole frame (elongation {ellipticity}). That points to tracking: guiding errors, wind, balance or polar alignment."
pixinsight = [
  "Restack using only the subs with round stars: SubframeSelector (Eccentricity below 0.5) or AdvAstro's sub selection.",
  "Mild elongation can be reduced afterwards with BlurXTerminator (it corrects non-round stars) or MorphologicalTransformation.",
]
"pixinsight@BlurXTerminator" = [
  "BlurXTerminator corrects mild elongation: Correct Only first, then Sharpen Stars 0.25.",
  "Restack without the worst subs: SubframeSelector or AdvAstro's sub selection.",
]
siril = [
  "Restack without the worst subs: in the sequence frame list, sort by roundness and unselect the poorest.",
]
capture = [
  "Check guiding (RMS under half your image scale), balance slightly east-heavy, and redo polar alignment.",
  "Shorter subs reduce the effect of wind and periodic error.",
]

[corner_stars]
why = "Stars in the corners are {corner_pct} % larger than in the centre{shape}. The optics do not give a flat, sharp field to the edges: usually the flattener or reducer spacing, or no flattener at all."
masks = ["star"]
pixinsight = [
  "Look at one single sub with Script › Image Analysis › AberrationInspector to see the pattern: stretched towards the centre = spacing too long or short; stretched along circles = field curvature.",
  "Repair this image: DynamicCrop to cut the worst corners, or shrink stars there with MorphologicalTransformation through a star mask (recipe below).",
]
"pixinsight@BlurXTerminator" = [
  "BlurXTerminator corrects coma and astigmatism per region: run it on the linear image with Correct Only first.",
  "Crop what remains with DynamicCrop.",
]
siril = [
  "Crop the worst corners, or reduce the stars after StarNet separation (Star Recomposition).",
]
capture = [
  "{capture_hint}",
]

[corner_elongation]
why = "Stars are stretched in the {corner} corner only (elongation {ecc}, against a round centre). One bad corner usually means tilt, a flattener or reducer at the wrong distance with the optical axis off-centre, collimation, or a pinched or shifted optical element. Rotated subs in the stack can also put a stretched corner where you would not expect one."
masks = ["corner", "star"]
pixinsight = [
  "Look at the direction of the stretch with Script › Image Analysis › AberrationInspector on one single sub: stars pointing towards the centre mean spacing (back focus); stars stretched along circles mean field curvature or astigmatism; only one corner means tilt or an off-axis component.",
  "Repair this image: crop that corner with DynamicCrop if the composition allows.",
  "Or repair it locally: make a corner mask and a star mask (recipes below), multiply them in PixelMath (corner*stars) so only the stars in that corner are white, and apply MorphologicalTransformation (Morphological Selection 0.3–0.5, size 3) through it.",
]
"pixinsight@BlurXTerminator" = [
  "BlurXTerminator on the linear image (Correct Only first): it fixes elongation per region, including a single corner.",
  "Crop what remains with DynamicCrop.",
  "Check one single sub with AberrationInspector to find the cause for the next session.",
]
siril = [
  "Crop that corner (Image › Crop), or reduce the stars there after StarNet separation and Star Recomposition.",
  "Check one single sub with Analysis › Image Analysis (Aberration Inspector) to see the cause.",
]
capture = [
  "Prevent it: set the flattener or reducer spacing exactly (often 55 mm from the thread to the sensor), make sure the camera and corrector sit squarely without play, and use the camera's tilt plate if it has one.",
  "Test after every change with one sub and the aberration inspector, before a whole night of imaging.",
]

[tilt]
why = "One corner is clearly sharper than the opposite one (they differ by {tilt_pct} %). Sensor tilt is the textbook cause, but just as common are: back focus slightly off with the optical axis off-centre on the sensor; collimation (reflectors, RASA, SCT); a pinched or shifted lens or corrector; flexure in the focuser or imaging train; and stacking — subs rotated between nights or after a meridian flip mix different corners, and an off-centre crop makes it look one-sided."
pixinsight = [
  "Find out first whether it is in the optics or in the stack: open one single calibrated sub and run Script › Image Analysis › FWHMEccentricity. If the single sub is even, the cause is stacking or cropping, not the camera.",
  "If the single sub shows it too: Script › Image Analysis › AberrationInspector makes a 3×3 mosaic of the corners and centre, so you can see which way stars are stretched.",
  "For this image: BlurXTerminator (Correct Only) evens out regional blur; otherwise crop the softest edge with DynamicCrop, or shrink stars there through a corner mask (recipe below) combined with a star mask.",
]
"pixinsight@BlurXTerminator" = [
  "Check one single calibrated sub with Script › Image Analysis › FWHMEccentricity or AberrationInspector: is the softness in the optics, or only in the stack?",
  "For this image: BlurXTerminator on the linear image, Correct Only first; it corrects blur and elongation per region. Crop what remains with DynamicCrop.",
]
siril = [
  "Check one single sub: Analysis › Image Analysis (Aberration Inspector) or Dynamic PSF in each corner. Even in a single sub means the stack or the crop causes it.",
  "For this image: crop the softest edge (Image › Crop).",
]
masks = ["corner", "star"]
capture = [
  "Tell the causes apart: rotate the camera 90° and take one sub. A soft corner that moves with the camera is in the camera side (tilt, adapter, spacing); one that stays in place is in the telescope (collimation, pinched optics).",
  "Back focus: put the sensor at exactly the distance your flattener or reducer asks for (often 55 mm); a millimetre off shows as soft or stretched corners.",
  "Check for play in the focuser and the camera connection, and tighten lens cells only finger-tight.",
]

[star_rings]
why = "{ring_pct} % of the bright stars have a dark ring around them. Rings come from over-sharpening or too many deconvolution iterations, and are one of the first things experienced viewers notice."
pixinsight = [
  "Redo deconvolution with fewer iterations and the Deringing option on (global dark 0.02–0.05, with a star mask).",
  "Lower the strength of UnsharpMask / MultiscaleLinearTransform sharpening, and apply it through a mask that excludes stars.",
]
"pixinsight@BlurXTerminator" = [
  "Lower BlurXTerminator's Sharpen Stars (0.2–0.3) and avoid extra sharpening on top.",
  "Sharpen only nonstellar detail, through a star mask.",
]
siril = [
  "Redo deconvolution with fewer iterations, or apply Unsharp Mask more gently and only to the starless image.",
]

[star_color]
why = "Stars look almost colourless (colour spread {color_spread}). Real stars range from blue-white to orange; that variety makes an image feel natural and deep."
masks = ["star"]
pixinsight = [
  "Colour-calibrate with SPCC on the linear data.",
  "Stretch stars separately with ArcsinhStretch, which keeps colour in the stars.",
  "Increase saturation on the stars only, through a star mask (CurvesTransformation, saturation curve).",
]
siril = [
  "Spectrophotometric Color Calibration, then Asinh Transformation for the stars (it preserves colour).",
  "Color Saturation on the star image after StarNet separation.",
]

[white_cores]
why = "Most bright stars have pure white, clipped cores. The colour is lost in the centre, which makes stars look like holes in the image."
masks = ["star"]
pixinsight = [
  "Stretch the stars with ArcsinhStretch instead of a plain histogram stretch.",
  "Or separate stars and use a gentler stretch for the star image.",
]
siril = [
  "Use Asinh Transformation on the stars (with the 'Use RGB working space' option) instead of a strong histogram stretch.",
]

[magenta_stars]
why = "Many stars are magenta. That is typical for narrowband or dual-band data, where stars are weak in the green channel."
pixinsight = [
  "Invert the image, apply SCNR (green, amount 0.5–0.8), and invert back: that removes magenta.",
  "Or replace the stars with RGB stars taken with a broadband filter.",
]
siril = [
  "Negative transformation, then Remove Green Noise (SCNR), then negative again.",
]

[fringe]
why = "Stars have a {fringe_color} rim: one colour is larger than the others. That is chromatic aberration in the optics, or channels aligned slightly differently."
pixinsight = [
  "Align the channels to each other (ChannelExtraction, StarAlignment of R and B to G, ChannelCombination).",
  "Reduce the fringe colour on the stars through a star mask (CurvesTransformation on that hue, or SCNR for green fringes).",
]
siril = [
  "Split channels, register them to the green channel, and recombine.",
]
capture = [
  "With a doublet or a camera lens, a narrow-band or UV/IR-cut filter reduces the fringe.",
]

[muted]
why = "Colours are muted (median saturation {saturation_pct} %). The object looks greyer than it is. Raise saturation on the object only: in the sky it would bring up colour noise."
masks = ["luminance", "range"]
pixinsight = [
  "Make sure colour calibration was done on the linear data (SpectrophotometricColorCalibration); saturation cannot fix wrong colour balance.",
  "Make a luminance mask (recipe below) so the background is protected.",
  "CurvesTransformation through the mask, S (saturation) channel: drag the middle of the line up a little (about 0.5 → 0.6). Apply 2–3 times rather than once strongly.",
  "Or ColorSaturation through the mask, raising the curve only at the hues of your object.",
]
siril = [
  "Image Processing › Color Saturation: amount 0.3–0.6, with Background factor about 1.5 so the sky is protected.",
  "Repeat in small steps rather than one large one.",
]
"why#galaxy" = "Colours are muted (median saturation {saturation_pct} %). Galaxies are subtle: a yellowish core, bluish arms and small pink star-forming regions. That variety is what makes a galaxy look real; it needs good colour calibration and a little saturation on the galaxy only."
"pixinsight#galaxy" = [
  "SpectrophotometricColorCalibration on the linear data, then BackgroundNeutralization if the sky is not neutral.",
  "Make a range mask on the galaxy (recipe below) so only the galaxy gets the saturation.",
  "CurvesTransformation, saturation channel, small lifts through the mask. Watch the pink HII regions and the blue arms appear, and stop before the core turns orange.",
]
"siril#galaxy" = [
  "Spectrophotometric Color Calibration on the linear data.",
  "Color Saturation, amount 0.3–0.5 with Background factor 2, in small steps.",
]

[oversaturated]
why = "Colours are pushed very hard ({sat_high} % of the object is near full saturation). That looks garish and hides the subtle variations in the object."
masks = ["luminance"]
pixinsight = [
  "Back off the saturation step; apply saturation in two or three small steps instead of one big one.",
  "Use a luminance mask to keep saturation away from the brightest parts.",
]
siril = [
  "Redo Color Saturation with a lower amount, or in smaller steps.",
]

[channel_clip]
why = "{channel_clip} % of the bright areas have one colour channel clipped. Colour detail disappears there, and the hue shifts."
pixinsight = [
  "Reduce saturation or the final stretch so no channel hits the top or bottom.",
  "Check with the Statistics process or the readout in the brightest parts.",
]
siril = [
  "Reduce saturation or the last stretch until the histogram no longer piles up at either end.",
]

[low_detail]
why = "Fine structure barely rises above the noise (detail ratio {detail_ratio}). The object looks soft or flat. Sharpen the object only, through a mask, so the sky noise does not grow."
masks = ["luminance", "range"]
pixinsight = [
  "Deconvolution on the linear image first: PSFImage (script) to measure your stars, then Deconvolution with that PSF, 20–40 iterations, Deringing on, through a luminance mask (recipe below).",
  "After the stretch: LocalHistogramEqualization (Kernel radius 64–128, Contrast limit 1.5–2, Amount 0.2–0.35) through a range mask on the object (recipe below).",
  "Or MultiscaleLinearTransform with Bias 0.05–0.1 on layers 2–4 through the same mask.",
]
"pixinsight@BlurXTerminator" = [
  "BlurXTerminator on the linear image: Sharpen Nonstellar 0.3–0.6 (it protects the sky by itself).",
  "After the stretch: LocalHistogramEqualization (radius 64–128, amount 0.25) through a range mask on the object (recipe below).",
]
siril = [
  "Deconvolution (Richardson-Lucy, PSF from stars) on the linear image.",
  "After the stretch: CLAHE (tile size 8–16, clip limit 1.5–2) on the starless object; blend it back with PixelMath if the sky gets noisy (recipe below).",
]

[low_contrast]
why = "The object barely rises above the background (only {contrast_pct} % of full scale). The image looks dim and flat; there is room to stretch more."
pixinsight = [
  "One more gentle stretch (GeneralizedHyperbolicStretch with highlight protection) or a CurvesTransformation midtone lift.",
  "Then contrast in the object: LocalHistogramEqualization through a mask, or HDRMultiscaleTransform for bright cores.",
]
siril = [
  "Generalized Hyperbolic Stretch: a further small stretch with highlight protection.",
  "Then CLAHE on the object for local contrast.",
]

[clipped_highlights]
why = "Bright parts of the object are burned out ({extended_clip_px} pixels at full white outside star cores). The structure in the brightest region is lost."
pixinsight = [
  "Go back to the linear image and stretch with highlight protection (GeneralizedHyperbolicStretch: Highlight protection 0.9).",
  "HDRMultiscaleTransform (6–8 layers, lightness mask) brings back structure in bright cores.",
]
siril = [
  "Redo the stretch with Generalized Hyperbolic Stretch's highlight protection, then a gentle HDR-style local contrast (CLAHE).",
]
capture = [
  "For targets with very bright cores (M42, M31), add a set of short subs and blend them in.",
]

[banding]
why = "The histogram has gaps ({comb_pct} % of the levels are empty): the image was stretched after being saved with 8 bits per channel, so smooth gradients turn into visible steps."
pixinsight = [
  "Process in 32-bit float from start to finish; only export to 8-bit JPEG as the very last step.",
  "If only the 8-bit version is left, a light noise addition (NoiseGenerator, 0.5 %) hides the steps.",
]
siril = [
  "Keep the working file in 32-bit FITS; export to JPEG or 8-bit PNG only at the end.",
]

[banding_risk]
why = "The sky is so smooth that 8-bit steps form flat patches ({plateau_pct} % of the sky). Smooth gradients may show contour lines on some screens."
pixinsight = [
  "Export as 16-bit TIFF or PNG for printing and sharing where possible.",
  "For JPEG, keep a little fine grain (lighter noise reduction) to dither the steps.",
]
siril = [
  "Export 16-bit TIFF/PNG where possible, and keep a little fine grain for JPEG.",
]

[jpeg]
why = "The JPEG is strongly compressed (quality about {jpeg_quality}, block artefacts {blockiness}x). Compression smears faint detail and adds 8x8 blocks in the sky."
pixinsight = [
  "Export with quality 92–95 (File › Save As › JPEG).",
  "Keep the master as XISF or 16-bit TIFF and export JPEGs from it, never from another JPEG.",
]
siril = [
  "Save As JPEG with quality 92–95, from the 32-bit master.",
]

[edges]
why = "The {edges} edge{edges_s} still show stacking borders (dark or noisy strips where not all subs overlapped)."
pixinsight = [
  "DynamicCrop until no ragged edge remains, or enable WBPP's Autocrop.",
]
siril = [
  "Select the clean area and Crop, or use the Crop option after registration.",
]

[small_image]
why = "The picture is only {megapixels} megapixels. Judges and AstroBin viewers zoom in; a small image hides your detail."
pixinsight = [
  "Share at full resolution, or at least 3000 pixels on the long side.",
]
siril = [
  "Share at full resolution, or at least 3000 pixels on the long side.",
]

[depth]
