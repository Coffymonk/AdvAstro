[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "advastro-analyzer"
version = "1.0.0"
description = "Advanced Astrophoto Analyzer: analyzes astro imaging sessions and recommends processing workflows for PixInsight, Siril and more."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Miklosoft" }]
requires-python = ">=3.12"
keywords = ["astrophotography", "fits", "xisf", "pixinsight", "siril", "analysis", "image rating"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "astropy>=6.0",
    "photutils>=3.0",
    "lz4>=4.3",
    "zstandard>=0.22",
    "pillow>=10.0",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7"]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.6", "PySide6-Essentials>=6.7"]

[project.urls]
Homepage = "https://miklosoft.se/main"
Source = "https://github.com/Coffymonk/AdvAstro"
Issues = "https://github.com/Coffymonk/AdvAstro/issues"

[project.scripts]
advastro = "advastro.cli:main"

[project.gui-scripts]
advastro-gui = "advastro.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/advastro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
